<script>
const results = [];

function assert(condition, message) {
    if (!condition) {
        throw new Error(message);
    }
}

async function loadText(path) {
    const response = await fetch(path);
    assert(response.ok, `failed to load ${path}: ${response.status}`);
    return response.text();
}

async function test(name, callback) {
    try {
        await callback();
        results.push(`PASS ${name}`);
    } catch (error) {
        results.push(`FAIL ${name}: ${error.stack || error.message}`);
    }
}

function extractParamsFields(shader) {
    const body = shader.match(/struct Params \{([\s\S]*?)\n\}/);
    assert(body, 'Params struct was not found');
    return [...body[1].matchAll(/^\s*(\w+):\s*f32,/gm)].map(match => match[1]);
}

function cameraPosition(yaw, pitch, distance = 3) {
    const cosPitch = Math.cos(pitch);
    return [
        distance * Math.sin(yaw) * cosPitch,
        distance * Math.sin(pitch),
        distance * Math.cos(yaw) * cosPitch,
    ];
}

function cameraAzimuth(position) {
    return Math.atan2(position[0], position[2]);
}

function approx(actual, expected, tolerance = 1e-6) {
    return Math.abs(actual - expected) <= tolerance;
}

            ['meshYawSlider', '-180', '180', '0'],
            ['meshPitchSlider', '-90', '90', '0'],
            ['meshYawRotationSpeedSlider', '-180', '180', '5'],

            const input = document.getElementById(id);
            assert(input, `${id} is missing`);

            assert(input.value === value, `${id} default is ${input.value}`);

        assert(!document.getElementById('meshCameraHeightSlider'), 'camera height control remains');

        const markupSpeed = document.getElementById('meshYawRotationSpeedSlider').value;
        const constructorSpeed = main.match(

        assert(constructorSpeed, 'renderer has no yaw speed default');
        assert(
            constructorSpeed[1] === markupSpeed,
            `markup default ${markupSpeed} does not match renderer default ${constructorSpeed[1]}`,
        );

        // The readout next to the slider is plain text and does not update itself.
        const readout = document.getElementById('meshYawRotationSpeedValue');
        assert(readout, 'yaw speed readout is missing');
        assert(
            readout.textContent.trim() === markupSpeed,
            `yaw speed readout shows ${readout.textContent.trim()}, slider is ${markupSpeed}`,

        const titledLabels = [...document.querySelectorAll('label[for][title]')];
        assert(titledLabels.length === tooltips.size, `expected ${tooltips.size} titled labels, got ${titledLabels.length}`);
        const expectedControlIds = new Set(tooltips.keys());
        for (const label of titledLabels) {

    await test('the params upload packs fields in the shader struct order', () => {
        // A mismatch here is silent at runtime: every shader would read the wrong
        // value out of the uniform, so assert the two orderings line up.
        const fields = extractParamsFields(common);
        const array = main.match(/const paramsData = new Float32Array\(\[([\s\S]*?)\n\s+\]\);/);
        assert(array, 'params upload array not found');
        const entries = array[1]
            .split('\n')
            .map(line => line.split('//')[0].trim().replace(/,$/, ''))
            .filter(Boolean);
        assert(
            entries.length === fields.length,
            `struct has ${fields.length} fields but the upload writes ${entries.length}`,
        );
        // Each entry should mention its field name, allowing for the documented
        // renames (seed <- fieldSeed, meshNorm* <- normalization.*).
        const alias = {
            seed: 'fieldSeed',
            meshNormCenterX: 'normalization.centerX',
            meshNormCenterY: 'normalization.centerY',
            meshNormCenterZ: 'normalization.centerZ',
            meshNormScale: 'normalization.scale',
        };
        fields.forEach((field, i) => {
            const expected = alias[field] || field;
            assert(
                entries[i].includes(expected),
                `slot ${i} is "${field}" in the shader but "${entries[i]}" in the upload`,
            );
        });
    });

        assert(toggle, 'background centering toggle is missing');
        assert(toggle.type === 'checkbox', 'background centering control is not a checkbox');
        assert(toggle.checked, 'background centering is not enabled by default');
        assert(main.includes('this.centerBackgroundCube = true;'), 'renderer default is not enabled');
        assert(main.includes("centerBackgroundCubeCheckbox.addEventListener('change'"), 'toggle is not wired to renderer state');
        assert(rasterizer.includes('let centeredGridCoord = floor(faceGridCoord) + 0.5;'), 'background face is not centered in its field cell');
        assert(rasterizer.includes('output.objectSpacePosition = worldPos;'), 'centered geometry and noise coordinates differ');

        const baseHalfSize = 10;
        for (const fieldRes of [1, 2, 15, 16, 511, 512]) {
            const faceGridCoord = (baseHalfSize + 1) * 0.5 * fieldRes;
            const centeredGridCoord = Math.floor(faceGridCoord) + 0.5;
            const centeredHalfSize = centeredGridCoord * 2 / fieldRes - 1;
            const positiveGrid = (centeredHalfSize + 1) * 0.5 * fieldRes;
            const negativeGrid = (-centeredHalfSize + 1) * 0.5 * fieldRes;
            assert(approx(positiveGrid % 1, 0.5), `positive face is not centered at resolution ${fieldRes}`);
            assert(approx((negativeGrid % 1 + 1) % 1, 0.5), `negative face is not centered at resolution ${fieldRes}`);
        }
    });

    await test('only the built-in cube geometry receives the epsilon scale', () => {
        const page = new DOMParser().parseFromString(index, 'text/html');
        assert(
            main.includes('const DEFAULT_MESH_GEOMETRY_SCALE = 1.0001;'),
            'default cube geometry epsilon changed',
        );
        assert(main.includes('this.meshScale = 1.0;'), 'renderer scale no longer starts at its exact UI value');
        assert(!main.includes('applyMeshScaleEpsilon'), 'epsilon still affects mesh scale controls');
        assert(main.includes('mesh.vertices[i] *= geometryScale;'), 'geometry scale is not applied before GPU upload');
        assert(
            main.includes('{ geometryScale: DEFAULT_MESH_GEOMETRY_SCALE }'),
            'default cube load does not request the geometry epsilon',
        );
        assert(
            (main.match(/geometryScale:/g) || []).length === 1,
            'geometry epsilon is applied outside the default cube load',
        );
        assert(Number(page.getElementById('meshScaleSlider')?.value) === 1, 'mesh scale slider does not start at its original size');
        assert(page.getElementById('meshScaleValue')?.textContent.trim() === '1.0', 'mesh scale readout does not start at its original size');

        const sourceMatch = main.match(/const DEFAULT_MESH_OBJ = `([\s\S]*?)`;/);
        assert(sourceMatch, 'default cube OBJ source is missing');
        const mesh = parseOBJ(sourceMatch[1]);
        for (let i = 0; i < mesh.vertices.length; i++) {
            assert(approx(Math.abs(mesh.vertices[i]), 0.5), 'default cube geometry remains rotated');
        }
        for (let i = 0; i < mesh.normals.length; i += 3) {
            const nonzeroComponents = mesh.normals
                .slice(i, i + 3)
                .filter((value) => Math.abs(value) > 1e-5);
            assert(nonzeroComponents.length === 1, 'default cube face is not axis-aligned');
        }
    });

    await test('camera yaw stays independent while mesh geometry remains unchanged', () => {
        const yaw = Math.PI / 3;
        const lowPitch = cameraPosition(yaw, -Math.PI / 4);
        const highPitch = cameraPosition(yaw, Math.PI / 4);
        assert(approx(cameraAzimuth(lowPitch), yaw), 'negative pitch changed camera yaw');
        assert(approx(cameraAzimuth(highPitch), yaw), 'positive pitch changed camera yaw');
        assert(rasterizer.includes('output.worldPosition = normalizedPos * meshScale;'), 'skinned mesh receives camera rotation');
        assert(rasterizer.includes('output.worldPosition = input.position * meshScale;'), 'static mesh receives camera rotation');
        assert(!rasterizer.includes('params.meshYaw'), 'mesh shader still consumes camera yaw');
        assert(!rasterizer.includes('params.meshPitch'), 'mesh shader still consumes camera pitch');
    });

    await test('the G-buffer carries a real world-space normal', () => {
        // The footprint target has two spare channels. They used to hold dPdx/dPdy
        // magnitudes while the noise pass read them as normal XY, so the Normals view
        // and the exported `normal` tensor were derivative magnitudes.
        assert(rasterizer.includes('output.footprint = vec4<f32>(footprint, input.objectId, n.x, n.y);'), 'footprint target does not pack the object ID and normal');
        assert(rasterizer.includes('let n = normalize(input.worldNormal);'), 'normal is not normalized before packing');
        assert(!rasterizer.includes('dPdxMag'), 'derivative magnitudes still occupy the normal slots');
        assert(!index.includes('Derivatives (dP/dx, dP/dy)'), 'the derivatives option remains in the UI');
    });

    document.getElementById('results').textContent = results.join('\n');
    document.title = results.some(line => line.startsWith('FAIL')) ? 'FAIL' : 'PASS';
})();
</script>
